name: Generate Daily Report

# UTC 23:00 = 北京时间次日 07:00
# 如需改为北京时间 07:30，把 cron 调整为 "30 23 * * *"
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # 用于显式派发 pages.yml：GITHUB_TOKEN 推送的提交不会自动触发其他 workflow
  actions: write

# 避免定时任务与手动触发同时运行，造成重复提交
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  generate:
    name: Generate & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 提升到 job 级：step 的 if 条件只能读到 job 级 env，
    # 无法读到同一 step 内定义的 env，故在此声明。
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 可选：覆盖默认模型 claude-sonnet-5
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/generate.py

      # 未配置 WECOM_WEBHOOK 时整步跳过（notify.py 内部也会优雅跳过，双保险）。
      # 通知失败不应阻断日报提交，因此 continue-on-error。
      # 注意：Pages 部署在 push 之后才完成，链接会有 1-2 分钟延迟
      - name: Notify WeCom (optional)
        if: ${{ env.WECOM_WEBHOOK != '' }}
        continue-on-error: true
        env:
          # 未配置该变量时，notify.py 会用 GITHUB_REPOSITORY 自动推导 Pages 地址
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: python scripts/notify.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          REPORT_DATE="$(TZ=Asia/Shanghai date +%F)"
          git commit -m "chore(report): ${REPORT_DATE} daily report"

          # 远端可能被其他提交更新，先 rebase 再推送
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # 关键：用默认 GITHUB_TOKEN 推送不会触发 pages.yml 的 push 事件，
      # 因此显式派发一次部署（workflow_dispatch 不受该限制）。
      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 给 GitHub 少量时间索引刚推送的提交，避免派发到旧 SHA
          sleep 10
          gh workflow run pages.yml --ref main
