name: Opportunity Radar

# UTC 06:00 = 北京时间 14:00
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取并打印，不写文件、不推送"
        type: boolean
        default: false

permissions:
  contents: write
  # 用于显式派发 pages.yml：GITHUB_TOKEN 推送的提交不会自动触发其他 workflow
  actions: write

# 避免定时任务与手动触发同时运行，造成重复提交
concurrency:
  group: opportunity-radar
  cancel-in-progress: false

jobs:
  radar:
    name: Scan & publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan sources
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/radar.py --dry-run
          else
            python scripts/radar.py
          fi

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add radar data/radar_seen.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          RADAR_DATE="$(TZ=Asia/Shanghai date +%F)"
          git commit -m "chore(radar): ${RADAR_DATE} opportunity radar"

          # 远端可能被其他提交更新，先 rebase 再推送
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Trigger Pages deployment
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          gh workflow run pages.yml --ref main
